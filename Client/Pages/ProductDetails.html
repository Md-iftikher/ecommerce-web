<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Product Details - eCommerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-blue-600 text-white text-center py-4">
        <h1 class="text-3xl font-semibold">Product Details</h1>
    </header>

    <!-- Product Details Section -->
    <main class="container mx-auto px-4 py-8">
        <div id="product-details" class="bg-white shadow-md rounded-lg p-8 max-w-4xl mx-auto">
            <!-- Product details will be displayed here -->
        </div>
    </main>

   
    <script>
        // Sample Product Data (should match with the All Products page)
        const products = [
            { id: 1, name: "Smartphone", price: "$499", category: "electronics", image: "https://via.placeholder.com/600", description: "A high-quality smartphone with advanced features." },
            { id: 2, name: "Laptop", price: "$999", category: "electronics", image: "https://via.placeholder.com/600", description: "A powerful laptop for all your computing needs." },
            { id: 3, name: "Smartwatch", price: "$199", category: "electronics", image: "https://via.placeholder.com/600", description: "Stay connected with this modern smartwatch." },
            { id: 4, name: "Headphones", price: "$149", category: "electronics", image: "https://via.placeholder.com/600", description: "Experience superior sound quality." },
            { id: 11, name: "Men's T-shirt", price: "$25", category: "fashion", image: "https://via.placeholder.com/600", description: "A comfortable and stylish t-shirt for men." },
            { id: 12, name: "Women's Dress", price: "$55", category: "fashion", image: "https://via.placeholder.com/600", description: "An elegant dress perfect for any occasion." },
        ];

        // Fetch product ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id'));

        // Find the product by ID
        const product = products.find(p => p.id === productId);

        // Display Product Details
        const productDetails = document.getElementById("product-details");

        if (product) {
            productDetails.innerHTML = `
                <img src="${product.image}" alt="${product.name}" class="w-full h-96 object-cover rounded-lg mb-6">
                <h2 class="text-3xl font-semibold mb-4">${product.name}</h2>
                <p class="text-blue-600 text-2xl font-bold mb-4">${product.price}</p>
                <p class="text-gray-700 mb-6">${product.description}</p>
                <a href="all-products.html" class="bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-800">Back to Products</a>
            `;
        } else {
            productDetails.innerHTML = "<p class='text-red-600'>Product not found.</p>";
        }
    </script>

</body>

</html>
